[build]
  publish = "public"
  command = ""

# Old page addresses from the previous site
[[redirects]]
  from = "/for_clinicians.html"
  to = "/clinicians.html"
  status = 301

[[redirects]]
  from = "/screening.html"
  to = "/#get-tested"
  status = 301

[[redirects]]
  from = "/meet_the_team.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/privacy.html"
  to = "/privacy-and-terms#privacy"
  status = 301

[[redirects]]
  from = "/terms.html"
  to = "/privacy-and-terms#terms"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src 'none'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
